name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.14"

jobs:
  quality:
    name: Lint, train, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: make install

      - name: Lint and format check
        run: make lint

      - name: Train model
        run: make train

      - name: Run tests
        run: make test

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts-${{ github.sha }}
          path: artifacts/
          retention-days: 14

  container:
    name: Build and smoke-test image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: make docker-build

      # A build that only proves the image compiles proves very little; start it and check
      # that it actually serves, including that the baked metadata names this commit.
      - name: Smoke test the running container
        run: |
          docker run -d --name api -p 8000:8000 house-price-api:latest
          for _ in $(seq 1 30); do
            curl -sf localhost:8000/health >/dev/null && break
            sleep 1
          done
          curl -sf localhost:8000/health
          curl -sf localhost:8000/ready
          curl -sf localhost:8000/model/info | tee /dev/stderr
          # Exact field comparison, not a substring match: the response is compact JSON,
          # so any whitespace assumption in a grep pattern would silently never match.
          baked=$(curl -sf localhost:8000/model/info             | python3 -c "import json,sys; print(json.load(sys.stdin)['git_sha'])")
          test "$baked" = "${{ github.sha }}" || { echo "git_sha mismatch: $baked"; exit 1; }
          curl -sf -X POST localhost:8000/predict \
            -H 'content-type: application/json' \
            -d '{"house_age":32,"mrt_distance":84.87882,"convenience_stores":10,"latitude":24.98298,"longitude":121.54024}'

      - name: Container logs on failure
        if: failure()
        run: docker logs api || true

      - name: Tear down
        if: always()
        run: docker rm -f api || true
